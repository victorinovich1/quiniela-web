name: Backup Diario de Base de Datos

on:
  schedule:
    # Todos los días a las 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Debug - Verificar Secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "❌ SUPABASE_DB_URL no está configurado"
            exit 1
          fi
          echo "✅ SUPABASE_DB_URL está presente"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      
      - name: Instalar PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates zip
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      
      - name: Ejecutar script de backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          bash scripts/backup-db.sh
      
      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiniela-backup-${{ github.run_number }}
          path: scripts/quiniela_backup_*.zip
          retention-days: 90
          compression-level: 0 # Ya está comprimido
      
      - name: Notificar éxito
        if: success()
        run: |
          echo "✅ Backup completado y almacenado por 90 días"
          echo "📁 Artifact: quiniela-backup-${{ github.run_number }}"
